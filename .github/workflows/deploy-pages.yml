name: Deploy Vite app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Vite application
        run: npm run build
      - name: Validate generated website
        run: |
          test -f dist/index.html
          test -d dist/assets
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for legacy branch-based Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Waiting for GitHub's automatic Jekyll deployment so Vite is published last."
          for attempt in $(seq 1 60); do
            statuses=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment") | .status] | join(",")')
            echo "Legacy Pages status: ${statuses:-not yet created}"
            if [[ -n "$statuses" && "$statuses" != *"queued"* && "$statuses" != *"in_progress"* && "$statuses" != *"waiting"* && "$statuses" != *"requested"* && "$statuses" != *"pending"* ]]; then
              break
            fi
            sleep 5
          done
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
